properties:
  dr-gpios:
    type: phandle-array
    description: Data ready pin for the trackpad
  rotate-90:
    type: boolean
  x-invert:
    type: boolean
  y-invert:
    type: boolean
  sleep:
    type: boolean
  no-secondary-tap:
    type: boolean
  no-taps:
    type: boolean
  sensitivity:
    type: string
    enum:
      - 1x
      - 2x
      - 3x
      - 4x
    description: ADC attenuation (sensitivity) setting.
  wheel-multiplier:
    type: int
    default: 8
    description: Multiplier applied to the native scroll wheel delta (tune scroll speed).
  pointer-multiplier:
    type: int
    default: 1
    description: Multiplier applied to pointer movement deltas (tune cursor speed).
  x-axis-z-min:
    type: int
    default: 5
  y-axis-z-min:
    type: int
    default: 4

